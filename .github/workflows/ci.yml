name: CI

# Compila la solucion y corre las pruebas en cada push a main o a una rama de
# trabajo, y en cada pull request hacia main. El runner es Windows porque el
# ejecutable de escritorio usa WPF + WinForms (net10.0-windows).

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test:
    name: Build y pruebas
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # No hace falta preparar la cadena de conexion: appsettings.json (versionado,
      # con la entrada vacia) viaja con el build, y ninguna prueba que no sea de
      # integracion llega a construir un SqlConnectionFactory. Las de integracion,
      # que si tocan una base, quedan excluidas por el filtro de mas abajo.

      - name: Restaurar
        run: dotnet restore PharmacySystem.sln

      - name: Compilar
        run: dotnet build PharmacySystem.sln --configuration Debug --no-restore --nologo

      - name: Pruebas (unidad, negocio, presentacion, UI)
        shell: pwsh
        run: |
          # Las pruebas de integracion ([Collection("Database")] en
          # PharmacySystem.Tests.Integration) necesitan un SQL Server con el
          # esquema aplicado; se corren en local. Aca se excluyen por namespace.
          dotnet test PharmacySystem.sln `
            --configuration Debug `
            --no-build `
            --nologo `
            --filter "FullyQualifiedName!~PharmacySystem.Tests.Integration" `
            --logger "trx;LogFileName=test-results.trx" `
            --results-directory TestResults
          if ($LASTEXITCODE -ne 0) { throw "Las pruebas fallaron (exit code $LASTEXITCODE)" }

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn
