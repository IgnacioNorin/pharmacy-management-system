name: CI

# Compila la solucion y corre las pruebas en cada push a main o a una rama de
# trabajo, y en cada pull request hacia main. El runner es Windows porque el
# proyecto de escritorio usa WinForms + packages.config + csproj clasico, que
# necesitan MSBuild y nuget.exe (el CLI de dotnet no puede compilarlo).

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test:
    name: Build y pruebas
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Preparar ConnectionStrings.config
        shell: pwsh
        run: |
          # Los ConnectionStrings.config reales estan fuera de git. El build copia
          # este archivo de contenido a la carpeta de salida y las pruebas de humo
          # de UI construyen un SqlConnectionFactory a partir de el (sin ejecutar
          # ninguna consulta). Un valor de marcador bien formado alcanza; las
          # pruebas de integracion, que si tocan una base, quedan excluidas de esta
          # corrida (ver el filtro mas abajo).
          $targets = @(
            'PharmacySystem',
            'PharmacySystem.Tests',
            'PharmacySystem.UiTests',
            'PharmacySystem.DbMigrator'
          )
          foreach ($t in $targets) {
            $example = Join-Path $t 'ConnectionStrings.config.example'
            $dest    = Join-Path $t 'ConnectionStrings.config'
            if ((Test-Path $example) -and -not (Test-Path $dest)) {
              Copy-Item $example $dest
              Write-Host "Copiado $dest"
            }
          }

      - name: Restaurar paquetes NuGet
        run: nuget restore PharmacySystem.sln

      - name: Compilar
        run: msbuild PharmacySystem.sln -t:Build -p:Configuration=Debug -m -v:minimal -nologo

      - name: Pruebas (unidad, negocio, presentacion, UI)
        shell: pwsh
        run: |
          # Las pruebas de integracion ([Collection("Database")] en
          # PharmacySystem.Tests.Integration) necesitan un SQL Server con el
          # esquema aplicado; se corren en local. Aca se excluyen por namespace.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vstest = & $vswhere -latest -products '*' -find '**\vstest.console.exe' | Select-Object -First 1
          if (-not $vstest) { throw 'No se encontro vstest.console.exe en el runner.' }
          Write-Host "vstest: $vstest"
          & $vstest `
            "PharmacySystem.Tests\bin\Debug\net48\PharmacySystem.Tests.dll" `
            "PharmacySystem.UiTests\bin\Debug\net48\PharmacySystem.UiTests.dll" `
            /TestCaseFilter:"FullyQualifiedName!~PharmacySystem.Tests.Integration" `
            /Logger:"trx;LogFileName=test-results.trx"
          if ($LASTEXITCODE -ne 0) { throw "Las pruebas fallaron (exit code $LASTEXITCODE)" }

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn
